name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Ruff for Python integration tests
        run: python -m pip install ruff==0.14.6
      - name: Install ESLint for JavaScript integration tests
        run: npm install --global eslint@9.39.1
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
